Name: KnockDock
Summary: Acoustic desk-knock gesture controller, conditional macro studio & PC bridge
Description: |
  KnockDock transforms the surface of your physical desk into an acoustic macro controller.
  Place your Android phone on your desk and knock, tap, or rap on the wood, glass, or metal surface to trigger instant Android actions, multi-step conditional macros, context profiles, smart-home webhooks, and authenticated Windows/Mac PC commands.

  Key Capabilities:
  - Real-Time Acoustic Desk-Surface Detection Engine: 6-axis accelerometer + gyroscope sensor fusion with a first-order high-pass filter, Exponential Moving Average (EMA) dynamic noise-floor tracking, adaptive thresholding, and refractory echo suppression.
  - Interactive Sensor Lab & 60 FPS Oscilloscope: Inspect live X/Y/Z acceleration, gyroscope magnitude, dynamic noise floor, peak hold, and impact triggers in real time with a synthetic knock signal injector.
  - Multi-Trial Gesture Trainer & Manual Pattern Editor: Calibrate custom 1-to-5 knock patterns with 3-trial recording, interval consistency scoring, and auto-calculated timing tolerances.
  - Custom Action Studio: 30 built-in actions across 10 categories, including a Multi-Step Conditional Macro Engine with dry-run simulation and loop protection.
  - Persistent Background Execution: Foreground sensor service with wake lock and Android 10+ overlay launch bridge.
  - Independent Liquid Glass UI: Real-time Kyant0 Liquid Glass optics with independent settings for Cards and Floating Bottom Navigation Bar.
