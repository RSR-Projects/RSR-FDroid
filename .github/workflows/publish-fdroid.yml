name: Publish RSR F-Droid Repository

on:
  push:
    branches: [main]
    paths:
      - "fdroid/**"
      - "web/**"
      - ".github/workflows/publish-fdroid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install F-Droid tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner default-jre-headless
          python -m pip install fdroidserver

      - name: Restore repository signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REPO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing REPO_KEYSTORE_BASE64 secret"
            exit 1
          }
          echo "$KEYSTORE_BASE64" | base64 --decode > fdroid/keystore.jks

      - name: Generate F-Droid index
        working-directory: fdroid
        env:
          REPO_KEYSTORE_PASSWORD: ${{ secrets.REPO_KEYSTORE_PASSWORD }}
          REPO_KEY_PASSWORD: ${{ secrets.REPO_KEY_PASSWORD }}
        run: |
          fdroid update --create-metadata

      - name: Prepare website files
        run: |
          mkdir -p site/fdroid
          cp -a fdroid/repo site/fdroid/repo
          cp -a web/* site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4